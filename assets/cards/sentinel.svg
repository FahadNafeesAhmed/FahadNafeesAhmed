<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>Sentinel KYC</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity="0"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4ADE80" stop-opacity=".13"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#4ADE80" fill-opacity=".1" stroke="#4ADE80" stroke-opacity=".35"/><g transform="translate(22 22)"><path class="hb" d="M4 23 H13 L16 16 L20 31 L24 11 L28 27 L30 23 H40" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">Sentinel KYC</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">PYTHON · OPENCV · MEDIAPIPE</text><rect x="349.6" y="24" width="68.4" height="20" rx="10" fill="#4ADE80" fill-opacity=".1" stroke="#4ADE80" stroke-opacity=".5"/><text class="m" x="383.8" y="37.5" font-size="9.5" font-weight="700" fill="#4ADE80" text-anchor="middle" textLength="46.4" lengthAdjust="spacingAndGlyphs">RESEARCH</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">Multi-modal liveness and anti-spoofing: heart rate from</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">skin colour (rPPG), moiré detection with a 2-D FFT,</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">depth from parallax and virtual-camera checks.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#4ADE80">478</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">3D face landmarks</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#4ADE80">FFT</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">rPPG + moiré</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#4ADE80">8</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">biometric signals</text></g><rect x="22.0" y="210" width="56.6" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="50.3" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">OpenCV</text><rect x="84.6" y="210" width="69.7" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="119.5" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">MediaPipe</text><rect x="160.3" y="210" width="46.8" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="183.7" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">SciPy</text><rect x="213.1" y="210" width="69.7" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="248.0" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Streamlit</text><rect x="288.8" y="210" width="48.7" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="313.2" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Plotly</text></svg>