<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>Crucible</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A78BFA" stop-opacity=".13"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".35"/><g transform="translate(22 22)"><circle cx="22" cy="9" r="4.2" fill="#A78BFA"/><circle cx="34" cy="31" r="4.2" fill="#A78BFA"/><circle cx="10" cy="31" r="4.2" fill="#A78BFA"/><path d="M22 9 L34 31 L10 31 Z" stroke="#A78BFA" stroke-opacity=".45" stroke-width="1.5" fill="none"/><circle r="2.4" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M22 9 L34 31 L10 31 Z"/></circle></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">Crucible</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">PYTHON · GEMINI · GOOGLE ADK</text><rect x="292.9" y="24" width="125.1" height="20" rx="10" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5"/><text class="m" x="355.4" y="37.5" font-size="9.5" font-weight="700" fill="#A78BFA" text-anchor="middle" textLength="103.1" lengthAdjust="spacingAndGlyphs">GOOGLE CLOUD HACK</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">A self-improving fake-review detector. A Forger attacks,</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">a Detector judges, and a Reflector writes each lesson</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">into Arize Phoenix as a rule the Detector reads next.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#A78BFA">3</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">Gemini agents</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#A78BFA">1,600</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">labelled benchmark</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#A78BFA">live</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">on Cloud Run</text></g><rect x="22.0" y="210" width="52.2" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="48.1" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Gemini</text><rect x="80.2" y="210" width="75.6" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="118.0" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Google ADK</text><rect x="161.9" y="210" width="88.0" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="205.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Arize Phoenix</text><rect x="255.8" y="210" width="41.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="276.5" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">MCP</text><rect x="303.2" y="210" width="67.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="336.9" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Cloud Run</text></svg>