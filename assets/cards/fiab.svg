<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>FIAB</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity="0"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBBF24" stop-opacity=".13"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".35"/><g transform="translate(22 22)"><rect x="7" y="13" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="15" y="13" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="23" y="13" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="31" y="13" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="7" y="23" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="15" y="23" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/><rect x="23" y="23" width="6" height="8" rx="1.5" fill="#FB7185"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></rect><rect x="31" y="23" width="6" height="8" rx="1.5" fill="#FBBF24" fill-opacity=".8"/></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">FIAB</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">PYTHON · FASTAPI · REACT</text><rect x="343.3" y="24" width="74.7" height="20" rx="10" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".5"/><text class="m" x="380.6" y="37.5" font-size="9.5" font-weight="700" fill="#FBBF24" text-anchor="middle" textLength="52.7" lengthAdjust="spacingAndGlyphs">BENCHMARK</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">A simulated 8-GPU HGX node with calibrated fault injection.</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">It asks where LLM diagnosis actually beats a cheap</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">statistical baseline, and where it is overkill.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#FBBF24">8</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">simulated GPUs</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#FBBF24">3</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">agent classes</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#FBBF24">P/R/F1</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">+ time to detect</text></g><rect x="22.0" y="210" width="59.7" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="51.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">FastAPI</text><rect x="87.7" y="210" width="48.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="111.9" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">React</text><rect x="142.1" y="210" width="81.0" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="182.6" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Prometheus</text><rect x="229.1" y="210" width="104.8" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="281.5" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">DCGM telemetry</text></svg>