<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>Redcell</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#F472B6" stop-opacity="0"/><stop offset=".5" stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F472B6" stop-opacity=".13"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".35"/><g transform="translate(22 22)"><line x1="13" y1="8" x2="13" y2="37" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/><path d="M13 9 H33 L28 15.5 L33 22 H13 Z" fill="#F472B6" fill-opacity=".85"><animate attributeName="d" values="M13 9 H33 L28 15.5 L33 22 H13 Z;M13 9 Q23 6 33 10 L28 16 L33 23 Q23 20 13 22 Z;M13 9 H33 L28 15.5 L33 22 H13 Z" dur="2s" repeatCount="indefinite"/></path></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">Redcell</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">PYTHON · STATIC ANALYSIS · SECURITY</text><rect x="349.6" y="24" width="68.4" height="20" rx="10" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".5"/><text class="m" x="383.8" y="37.5" font-size="9.5" font-weight="700" fill="#F472B6" text-anchor="middle" textLength="46.4" lengthAdjust="spacingAndGlyphs">SECURITY</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">Reads a Python repo, traces untrusted input to dangerous</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">sinks through its call graph, and turns each finding into</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">a playable CTF challenge that is verified automatically.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#F472B6">6</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">vulnerability classes</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#F472B6">offline</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">no API key needed</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#F472B6">auto</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">exploit verification</text></g><rect x="22.0" y="210" width="78.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="61.2" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Python AST</text><rect x="106.4" y="210" width="107.0" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="159.9" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">SQLite call graph</text><rect x="219.4" y="210" width="45.6" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="242.2" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Flask</text><rect x="271.0" y="210" width="53.0" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="297.5" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">pytest</text></svg>