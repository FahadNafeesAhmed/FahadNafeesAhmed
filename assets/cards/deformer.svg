<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>Neural Facial Deformer</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".13"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#5EEAD4" fill-opacity=".1" stroke="#5EEAD4" stroke-opacity=".35"/><g transform="translate(22 22)"><line x1="8" y1="12" x2="36" y2="12" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="12" r="3.4" fill="#5EEAD4"><animate attributeName="cx" values="10;30;10" dur="3.1s" repeatCount="indefinite"/></circle><line x1="8" y1="22" x2="36" y2="22" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/><circle cx="26" cy="22" r="3.4" fill="#5EEAD4"><animate attributeName="cx" values="26;12;26" dur="2.3s" repeatCount="indefinite"/></circle><line x1="8" y1="32" x2="36" y2="32" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="32" r="3.4" fill="#5EEAD4"><animate attributeName="cx" values="16;32;16" dur="2.7s" repeatCount="indefinite"/></circle></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">Neural Facial Deformer</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">PYTHON · PYTORCH · CUDA · OPENUSD</text><rect x="349.6" y="24" width="68.4" height="20" rx="10" fill="#5EEAD4" fill-opacity=".1" stroke="#5EEAD4" stroke-opacity=".5"/><text class="m" x="383.8" y="37.5" font-size="9.5" font-weight="700" fill="#5EEAD4" text-anchor="middle" textLength="46.4" lengthAdjust="spacingAndGlyphs">FLAGSHIP</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">Raw, noisy 3D face scans in. 53 ARKit blendshape weights,</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">head pose and identity out, written as a USD rig that</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">opens in Blender, Maya or Houdini.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#5EEAD4">0.76 mm</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">surface error</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#5EEAD4">5.7×</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">more accurate than ICP</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#5EEAD4">17×</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">faster than ICP</text></g><rect x="22.0" y="210" width="116.3" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="80.2" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Point transformer</text><rect x="144.3" y="210" width="59.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="174.0" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">GPU ICP</text><rect x="209.7" y="210" width="63.7" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="241.5" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">OpenUSD</text><rect x="279.4" y="210" width="57.3" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="308.0" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Blender</text><rect x="342.6" y="210" width="54.2" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="369.7" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Docker</text></svg>