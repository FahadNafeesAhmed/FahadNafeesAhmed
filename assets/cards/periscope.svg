<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="250" viewBox="0 0 440 250" fill="none" role="img"><title>Periscope</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.mt{opacity:0;animation:up .6s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.hb{stroke-dasharray:60;animation:hb 1.6s linear infinite}@keyframes hb{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bga" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="439" height="249" rx="16" fill="url(#bg)" stroke="#1d2940"/><rect x="53" y="0" width="334" height="1.5" fill="url(#bga)"/><defs><radialGradient id="gl" cx="420" cy="0" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38BDF8" stop-opacity=".13"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="438" height="248" rx="15" fill="url(#gl)"/><rect x="22" y="22" width="44" height="44" rx="11" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".35"/><g transform="translate(22 22)"><circle cx="22" cy="22" r="14" stroke="#38BDF8" stroke-opacity=".45" stroke-width="1.5"/><circle cx="22" cy="22" r="7" stroke="#38BDF8" stroke-opacity=".3" stroke-width="1.2"/><g><path d="M22 22 L22 8 A14 14 0 0 1 34 15 Z" fill="#38BDF8" fill-opacity=".35"/><line x1="22" y1="22" x2="22" y2="8" stroke="#38BDF8" stroke-width="1.8"/><animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="3s" repeatCount="indefinite"/></g><circle cx="28" cy="16" r="2" fill="#38BDF8"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle></g><text x="80" y="42" font-size="18.5" font-weight="700" fill="#E6EDF6">Periscope</text><text class="m" x="80" y="60" font-size="10.5" fill="#8C9BB5" letter-spacing=".6">TYPESCRIPT · STEEL · PLAYWRIGHT</text><rect x="343.3" y="24" width="74.7" height="20" rx="10" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".5"/><text class="m" x="380.6" y="37.5" font-size="9.5" font-weight="700" fill="#38BDF8" text-anchor="middle" textLength="52.7" lengthAdjust="spacingAndGlyphs">HACKATHON</text><text x="22" y="94.0" font-size="13" fill="#B9C5D8">Super parsers for competitors: clicks every toggle, loads</text><text x="22" y="112.5" font-size="13" fill="#B9C5D8">every country and walks past the login on Steel cloud</text><text x="22" y="131.0" font-size="13" fill="#B9C5D8">browsers. I built the browser layer, login and walker.</text><g class="mt" style="animation-delay:0.15s"><rect x="22.0" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="34.0" y="170" font-size="18" font-weight="800" fill="#38BDF8">63/65</text><text x="34.0" y="187" font-size="10.5" fill="#8C9BB5">hidden facts found</text></g><g class="mt" style="animation-delay:0.27s"><rect x="156.7" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="168.7" y="170" font-size="18" font-weight="800" fill="#38BDF8">22/65</text><text x="168.7" y="187" font-size="10.5" fill="#8C9BB5">frontier model + fetch</text></g><g class="mt" style="animation-delay:0.39s"><rect x="291.3" y="146" width="126.7" height="50" rx="10" fill="#0b1220" stroke="#1d2940"/><text x="303.3" y="170" font-size="18" font-weight="800" fill="#38BDF8">78</text><text x="303.3" y="187" font-size="10.5" fill="#8C9BB5">tests</text></g><rect x="22.0" y="210" width="45.6" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="44.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Steel</text><rect x="73.6" y="210" width="75.5" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="111.4" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Playwright</text><rect x="155.1" y="210" width="57.3" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="183.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Next.js</text><rect x="218.4" y="210" width="51.4" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="244.1" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Claude</text><rect x="275.9" y="210" width="53.9" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="302.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">SQLite</text><rect x="335.7" y="210" width="54.2" height="22" rx="11" fill="#0f1728" stroke="#1d2940"/><text x="362.8" y="225" font-size="11" fill="#8C9BB5" text-anchor="middle">Qdrant</text></svg>