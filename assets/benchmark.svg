<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="350" viewBox="0 0 900 350" fill="none" role="img"><title>Benchmark results</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:gr 1.1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes gr{to{transform:scaleX(1)}}.fd{opacity:0;animation:fi .5s ease-out forwards}@keyframes fi{to{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1524"/><stop offset="1" stop-color="#0A0E16"/></linearGradient><linearGradient id="bgga" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="899" height="349" rx="16" fill="url(#bgg)" stroke="#1d2940"/><rect x="108" y="0" width="684" height="1.5" fill="url(#bgga)"/><defs><linearGradient id="ours" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#475569"/></linearGradient></defs><text class="m" x="30" y="40" font-size="12" fill="#8C9BB5" letter-spacing="1">// BENCHMARK</text><text x="30" y="68" font-size="21" font-weight="700" fill="#E6EDF6">Same 256 noisy scans, every method</text><text x="30" y="112" font-size="13.5" font-weight="700" fill="#E6EDF6">Surface error</text><text class="m" x="30" y="130" font-size="10.5" fill="#4A5872">millimetres from the true face · lower is better</text><text x="30" y="165" font-size="12" fill="#E6EDF6">Hybrid (mine)</text><rect x="170" y="152" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.20s"><rect x="170" y="152" width="29.7" height="18" rx="5" fill="url(#ours)"/></g><text class="m fd" x="207.7" y="165.5" font-size="12" font-weight="700" fill="#5EEAD4" style="animation-delay:0.70s">0.76 mm</text><text x="30" y="203" font-size="12" fill="#E6EDF6">Neural only (mine)</text><rect x="170" y="190" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.32s"><rect x="170" y="190" width="51.7" height="18" rx="5" fill="url(#ours)"/></g><text class="m fd" x="229.7" y="203.5" font-size="12" font-weight="700" fill="#5EEAD4" style="animation-delay:0.82s">1.32 mm</text><text x="30" y="241" font-size="12" fill="#8C9BB5">ICP, true pose given</text><rect x="170" y="228" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.44s"><rect x="170" y="228" width="42.3" height="18" rx="5" fill="url(#base)"/></g><text class="m fd" x="220.3" y="241.5" font-size="12" font-weight="700" fill="#8C9BB5" style="animation-delay:0.94s">1.08 mm</text><text x="30" y="279" font-size="12" fill="#8C9BB5">Tuned ICP</text><rect x="170" y="266" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.56s"><rect x="170" y="266" width="170.2" height="18" rx="5" fill="url(#base)"/></g><text class="m fd" x="348.2" y="279.5" font-size="12" font-weight="700" fill="#8C9BB5" style="animation-delay:1.06s">4.35 mm</text><text x="470" y="112" font-size="13.5" font-weight="700" fill="#E6EDF6">Time per scan</text><text class="m" x="470" y="130" font-size="10.5" fill="#4A5872">log scale · lower is better</text><text x="470" y="165" font-size="12" fill="#E6EDF6">Hybrid (mine)</text><rect x="610" y="152" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.20s"><rect x="610" y="152" width="118.1" height="18" rx="5" fill="url(#ours)"/></g><text class="m fd" x="736.1" y="165.5" font-size="12" font-weight="700" fill="#5EEAD4" style="animation-delay:0.70s">75.8 ms</text><text x="470" y="203" font-size="12" fill="#E6EDF6">Neural only (mine)</text><rect x="610" y="190" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.32s"><rect x="610" y="190" width="37.9" height="18" rx="5" fill="url(#ours)"/></g><text class="m fd" x="655.9" y="203.5" font-size="12" font-weight="700" fill="#5EEAD4" style="animation-delay:0.82s">1.9 ms</text><text x="470" y="241" font-size="12" fill="#8C9BB5">ICP, true pose given</text><rect x="610" y="228" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.44s"><rect x="610" y="228" width="147.8" height="18" rx="5" fill="url(#base)"/></g><text class="m fd" x="765.8" y="241.5" font-size="12" font-weight="700" fill="#8C9BB5" style="animation-delay:0.94s">296.1 ms</text><text x="470" y="279" font-size="12" fill="#8C9BB5">Tuned ICP</text><rect x="610" y="266" width="180" height="18" rx="5" fill="#0d1526"/><g class="bar" style="animation-delay:0.56s"><rect x="610" y="266" width="180.0" height="18" rx="5" fill="url(#base)"/></g><text class="m fd" x="798.0" y="279.5" font-size="12" font-weight="700" fill="#8C9BB5" style="animation-delay:1.06s">1,298.4 ms</text><line x1="450" y1="100" x2="450" y2="300" stroke="#243049"/><text x="30" y="324" font-size="12.5" fill="#8C9BB5">Hybrid vs tuned ICP: <tspan fill="#5EEAD4" font-weight="700">5.7× more accurate</tspan> and <tspan fill="#38BDF8" font-weight="700">17× faster</tspan>. The network alone needs 1.9 ms per scan.</text></svg>